<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxury Motors - Create an account (demo)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="banner">SHOWCASE DEMO - forms are not connected to anything</div>
<nav id="nav"></nav>
    <div class="container">

  <div class="images">
    <img src="img/hero.jpg" alt="BMW X5 (photo by Dinkun Chen, see credits)">
  </div>

  <div class="main">

   <div class="text">
      <h1>Create an account</h1>
      <p>Join us to explore the world of premium vehicles.</p>
    </div>
    
    <form id="signup-form" novalidate>
      <label for="full-name">Full Name</label>
      <input type="text" id="full-name" placeholder="Enter your full name" >

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email" >

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Password" >
      <label for="confirm-password">Confirm Password</label>
      <input type="password" id="confirm-password" placeholder="Confirm Password" >
      
      <div class="terms">
  <input type="checkbox" id="terms" >
  <label for="terms">I agree to the Terms and Conditions</label>
    </div>
      <button class="btn" type="submit">Create Account</button>
      <p id="form-msg" class="msg" role="status"></p>
      <p id="footer-text"> Already have an account ? <a href="login.html"><span>SIGN IN</span></a></P>
    </form>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
