<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Luxury Motors - Contact (demo)</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="banner">SHOWCASE DEMO - forms are not connected to anything</div>
<nav id="nav"></nav>
<div class="page formpage"><h1>Contact</h1><p>Demo form. Messages are not sent anywhere.</p>
<form id="contact-form" novalidate><label for="name">Name</label><input id="name" placeholder="Your name"><label for="email">Email</label><input type="email" id="email" placeholder="Your email"><label for="message">Message</label><textarea id="message" placeholder="How can we help?"></textarea><button class="btn" type="submit">Send</button><p id="form-msg" class="msg" role="status"></p></form></div>
<script src="app.js"></script>
</body></html>
